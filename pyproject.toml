[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "career-agent-workbench"
version = "2.0.0"
description = "A public-safe scaffold for governed career workflow automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "mperkhou" },
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "extruct>=0.16,<1",
  "flask>=3,<4",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "markupsafe>=2.1,<4",
  "mcp>=1.13,<2",
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "reportlab>=4.2,<5",
  "trafilatura>=1.12,<3",
  "w3lib>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.12,<1",
]
browser = [
  "playwright>=1.45,<2",
]

[project.scripts]
career-agent-workbench = "career_agent_workbench.__main__:main"
career-agent-workbench-audit-jods = "career_agent_workbench.jod_cleaner_audit:main"
career-agent-workbench-refine-resume = "career_agent_workbench.resume_refinement_cli:main"
career-agent-workbench-seed-jobs = "career_agent_workbench.workflows.matching:main"
career-agent-workbench-webapp = "career_agent_workbench.webapp:main"
career-agent-workbench-mcp = "career_agent_workbench.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/career_agent_workbench"]

