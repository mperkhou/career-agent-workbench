      text: 'Test-Governed AI Assistance: Introduced coding assistants into Python maintenance through repository-local guidance that emphasized real constructors, reusable fixtures, focused test iteration, lint review, full-suite confirmation, and changelog discipline. Tessa treated generated suggestions as untrusted draft material, requiring code review and evidence from the same validation surfaces used for human-authored changes. Retrospectives captured failure patterns such as over-mocking, stale assumptions, and broad edits, then turned them into clearer constraints. The practice improved iteration speed while preserving traceability and the team''s existing engineering quality bar.'
