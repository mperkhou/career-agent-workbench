      render: true
      text: 'Managed Search Migration: Helped move several observability datasets from self-hosted search clusters to a managed OpenSearch service. Tessa automated repeatable migration stages, compared document and time-window coverage, detected duplicate identities, reconciled late-arriving records, and kept monitoring useful while writers changed destinations. The migration was treated as a data-integrity project rather than a copy operation: acceptance evidence included counts, sampled queries, retention behavior, lifecycle-policy checks, and documented exceptions. Follow-up work addressed index bootstrapping, shipping stability, and operator playbooks so the new backend could be supported after the cutover team stepped away.'
