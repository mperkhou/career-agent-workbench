      render: true
      text: 'Local Tool Runtime and Safety Boundaries: Built a local-first Python toolkit exposed through a command-line interface, a Model Context Protocol server, and an importable SDK over shared runtime logic. The design separated read operations from approval-required control actions, required explicit environment routing, rejected secret-bearing arguments, bounded result pagination, and tested authorization-sensitive paths. Safe reads used bounded retry rules, while mutation requests remained non-retrying and required a newly confirmed scope. Source-control helpers, package checks, unit tests, and static analysis made the toolkit portable across developer environments. The same core could support later service adapters without duplicating policy decisions in every interface or defaulting silently to a sensitive environment.'
