      text: 'Actionable Monitoring and Ownership: Developed Prometheus rules, cloud-metric checks, local health scripts, and notification routes for automation controllers, configuration services, search clusters, log shippers, managed databases, disk capacity, and stuck jobs. During team-boundary changes, Tessa helped inventory existing alerts, remove obsolete destinations, assign service ownership, and test escalation behavior using synthetic events. Each check aimed to distinguish symptoms from likely causes and to point responders toward a bounded next action. This reduced reliance on manual inspection and made handoffs clearer without allowing monitoring automation to perform unapproved production changes.'
