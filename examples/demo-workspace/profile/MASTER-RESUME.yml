    line_1:
      company_name_text: Northbridge Systems Cooperative | Remote
      position_name_text: Senior Platform Reliability Engineer
      position_dates_text: Mar 2021 - Present
    line_2:
      position_intro_text: Northbridge Systems Cooperative is a mid-sized technology organization whose Platform Foundations group operates shared automation, configuration, search, and observability services for internal engineering teams. Tessa contributes Python implementation, service hardening, release engineering, developer workflows, documentation, and enablement within that federated model while keeping changes reviewable and operational authority clearly separated.
    bullet_points:
    - order: 1
      render: true
      text: 'Shared Automation Platform Operations: Helped operate several isolated automation-controller deployments used across development, validation, and production-like environments. Work included controller upgrades, execution-node rebuilds, inventory synchronization, credential-bound job templates, queue recovery, workflow logging, and capacity alignment. Tessa converted repeated support cases into tested Ansible roles and documented recovery procedures, then validated changes in lower environments before coordinated rollout. Schedule audits and synthetic inventory snapshots made it possible to compare expected coverage with actual controller state before a maintenance window. The resulting platform made routine configuration work more consistent while allowing service-owning teams to retain responsibility for their own playbooks and approvals.'
