name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check tracked public tree
        run: python scripts/check_public_safety.py tree --root .
      - name: Install development dependencies
        run: python -m pip install '.[dev]'
      - name: Lint
        run: make lint
      - name: Check formatting
        run: make format-check
      - name: Test
        run: make test

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check tracked public tree
        run: python scripts/check_public_safety.py tree --root .
      - name: Install build tooling
        run: python -m pip install build
      - name: Build distributions
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Check distributions
        run: |
          set -eu
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/dist/*.whl)
          sdists=("$RUNNER_TEMP"/dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          python scripts/check_public_safety.py artifacts --root . --wheel "${wheels[0]}" --sdist "${sdists[0]}"
      - name: Install and smoke test wheel
        run: |
          set -eu
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install "${wheels[0]}"
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/installed/bin/career-agent-workbench" --version
          "$RUNNER_TEMP/installed/bin/career-agent-workbench" --help
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/scripts/check_public_safety.py" installed-smoke --expected-prefix "$RUNNER_TEMP/installed"
