      render: true
      text: 'Secure Configuration Snapshot Services: Co-designed a Python package that separates sensitive values from device configuration snapshots, encrypts protected material, publishes redacted versions to source control, and records restore metadata. The initial adapter was deliberately refactored behind parser and storage interfaces so additional equipment families could be added without changing the core transaction flow. Tessa wrote unit and integration tests for local and remote repository behavior, failure cleanup, key rotation, retrieval, and restore preparation, giving operators a safer alternative to informal backup scripts and making extension work predictable.'
